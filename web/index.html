<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta
      name="description"
      content="演算室：四则混合运算练习、本地与 GitHub 代码量统计和个人档案。"
    />
    <title>演算室 · 四则运算工作台</title>
    <link rel="icon" type="image/svg+xml" href="./assets/sprout.svg" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./workshop.css" />
    <link rel="stylesheet" href="./code-tool.css" />
    <link rel="stylesheet" href="./theme.css" />
    <link rel="stylesheet" href="./studio.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">跳到主要内容</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="#start" aria-label="演算室首页"
          ><span class="brand-icon">＋</span
          ><span>演算室</span></a
        >
        <nav aria-label="主导航">
          <a href="#start" data-nav="start">首页</a><a href="#math" data-nav="math">运算练习</a
          ><a href="#code" data-nav="code">代码统计</a
          ><a href="#home" data-nav="home">个人档案</a>
        </nav>
        <button class="button small outline" id="edit-profile">
          <span aria-hidden="true">✎</span> 编辑主页
        </button>
      </div>
    </header>
    <main id="main"></main>
    <footer class="site-footer">
      <a class="brand footer-brand" href="#start"
        ><span class="brand-icon">＋</span>演算室</a
      ><span>设定 · 演算 · 校对</span
      ><span class="footer-note">软件工程课程设计 · 2026</span>
    </footer>
    <dialog id="editor-dialog">
      <form id="editor-form">
        <div class="dialog-heading">
          <div>
            <span class="eyebrow">MAKE IT YOURS</span>
            <h2 id="dialog-title"></h2>
          </div>
          <button
            class="icon-button"
            type="button"
            id="close-dialog"
            aria-label="关闭"
          >
            ×
          </button>
        </div>
        <div id="editor-fields"></div>
        <p class="storage-note">保存到当前浏览器。建议使用同一地址打开主页。</p>
        <div class="dialog-actions">
          <button type="button" class="button outline" id="cancel-dialog">
            取消</button
          ><button class="button primary" type="submit">
            保存修改 <span>↗</span>
          </button>
        </div>
      </form>
    </dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="print-sheet"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
